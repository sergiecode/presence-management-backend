version: "3.8"

services:
  db:
    image: postgres:15
    container_name: absti-db
    restart: always
    environment:
      POSTGRES_DB: absti
      POSTGRES_USER: abstiuser
      POSTGRES_PASSWORD: abstipass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abstiuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: absti-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: abstiuser
      DB_PASSWORD: abstipass
      DB_NAME: absti
      POSTGRES_DB: absti
      POSTGRES_USER: abstiuser
      POSTGRES_PASSWORD: abstipass
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      PORT: 8080
    ports:
      - "8080:8080"
    working_dir: /app
    command: ./absti-api

volumes:
  pgdata:
