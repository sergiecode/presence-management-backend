definitions:
  gin.H:
    additionalProperties: {}
    type: object
  models.AbsenceHeatmapEntry:
    properties:
      count:
        type: integer
      date:
        type: string
    type: object
  models.AbsenceRequest:
    properties:
      date:
        type: string
      reason:
        type: string
      type:
        enum:
        - absence
        - late
        - medical
        type: string
    required:
    - date
    - reason
    - type
    type: object
  models.AbsenceResponse:
    properties:
      created_at:
        type: string
      date:
        type: string
      file_url:
        type: string
      id:
        type: integer
      reason:
        type: string
      type:
        type: string
      user_id:
        type: integer
    type: object
  models.AuditLog:
    properties:
      action:
        description: e.g. "update_checkin"
        type: string
      entity_id:
        description: e.g. checkin ID
        type: integer
      entity_type:
        description: e.g. "checkin"
        type: string
      id:
        type: integer
      new_value:
        description: JSON string of new checkin
        type: string
      old_value:
        description: JSON string of old checkin
        type: string
      timestamp:
        type: string
      user_email:
        description: Who made the change (HR/admin)
        type: string
    type: object
  models.AuditLogListResponse:
    properties:
      logs:
        items:
          $ref: '#/definitions/models.AuditLog'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  models.BatchApproveRequest:
    properties:
      action:
        description: '"approve" or "reject"'
        type: string
      ids:
        items:
          type: integer
        type: array
      reason:
        type: string
    type: object
  models.BatchApproveResponse:
    properties:
      failed:
        type: integer
      message:
        type: string
      processed:
        type: integer
      success:
        type: boolean
    type: object
  models.CheckinConfigRequest:
    properties:
      checkin_start_time:
        type: string
      notification_offset_min:
        type: integer
      timezone:
        type: string
    type: object
  models.CheckinRequest:
    properties:
      date:
        type: string
      gps_lat:
        type: number
      gps_long:
        type: number
      late_reason:
        type: string
      location_detail:
        type: string
      location_type:
        enum:
        - home
        - office
        - client
        - temporary
        type: string
      notes:
        type: string
      time:
        description: still accept string for backward compatibility
        type: string
      user_id:
        type: integer
    required:
    - date
    - location_type
    type: object
  models.CheckinResponse:
    properties:
      absence_id:
        type: integer
      checkout_status:
        type: string
      checkout_time:
        type: string
      created_at:
        type: string
      date:
        type: string
      gps_lat:
        type: number
      gps_long:
        type: number
      id:
        type: integer
      late:
        type: boolean
      late_reason:
        type: string
      location_detail:
        type: string
      location_type:
        type: string
      notes:
        type: string
      overtime:
        type: boolean
      time:
        description: return as RFC3339 string for API clients
        type: string
      user_id:
        type: integer
    type: object
  models.CheckoutRequest:
    properties:
      overtime:
        type: boolean
      status:
        type: string
    type: object
  models.CheckoutUpdateRequest:
    properties:
      checkout_status:
        type: string
      checkout_time:
        type: string
      overtime:
        type: boolean
    type: object
  models.DailySummary:
    properties:
      created_at:
        type: string
      date:
        type: string
      total_checkins:
        type: integer
      total_late:
        type: integer
      total_on_time:
        type: integer
      total_overtime:
        type: integer
      updated_at:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      details:
        example: Email is required
        type: string
      error:
        example: Invalid request
        type: string
    type: object
  models.LockAbsenceRequest:
    properties:
      locked:
        type: boolean
    type: object
  models.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: secret123
        type: string
    type: object
  models.LoginResponse:
    properties:
      email:
        example: user@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: John
        type: string
      picture:
        example: https://example.com/avatar.jpg
        type: string
      role:
        example: admin
        type: string
      token:
        example: jwt.token.here
        type: string
    type: object
  models.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  models.MonthlyStat:
    properties:
      late:
        type: integer
      month:
        type: string
      overtime:
        type: integer
      total:
        type: integer
    type: object
  models.OvertimeStatEntry:
    properties:
      date:
        type: string
      overtime:
        type: integer
    type: object
  models.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  models.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      name:
        example: John
        type: string
      password:
        example: secret123
        type: string
      phone:
        example: "+123456789"
        type: string
      surname:
        example: Doe
        type: string
    type: object
  models.ResendConfirmationRequest:
    properties:
      email:
        type: string
    type: object
  models.User:
    properties:
      checkin_start_time:
        type: string
      deactivated:
        type: boolean
      email:
        description: |-
          ID        uint      `gorm:"primaryKey"` // add manually if you want it in docs
          CreatedAt time.Time // add manually if you want it in docs
          UpdatedAt time.Time // add manually if you want it in docs
          DeletedAt gorm.DeletedAt `gorm:"index"` // add manually if you want it in docs
        type: string
      email_confirmed:
        type: boolean
      id:
        type: integer
      name:
        type: string
      notification_offset_min:
        description: minutes before check-in
        type: integer
      pending_approval:
        type: boolean
      phone:
        type: string
      picture:
        type: string
      role:
        type: string
      surname:
        type: string
      timezone:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/absences:
    get:
      description: Returns all absences for the authenticated user, newest first.
        JWT required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AbsenceResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get user's absence history
      tags:
      - absence
    post:
      consumes:
      - application/json
      description: User reports absence, late arrival, or medical leave. JWT required.
      parameters:
      - description: Absence data
        in: body
        name: absence
        required: true
        schema:
          $ref: '#/definitions/models.AbsenceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AbsenceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Report absence/late/medical
      tags:
      - absence
  /api/absences/{id}:
    delete:
      description: HR/admin only. Soft delete an absence by setting deleted=true.
      parameters:
      - description: Absence ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Soft delete absence (HR/admin)
      tags:
      - absence
    put:
      consumes:
      - application/json
      description: User can update their own absence if not locked. HR/admin can update
        any. JWT required.
      parameters:
      - description: Absence ID
        in: path
        name: id
        required: true
        type: integer
      - description: Absence data
        in: body
        name: absence
        required: true
        schema:
          $ref: '#/definitions/models.AbsenceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AbsenceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update absence/late/medical
      tags:
      - absence
  /api/absences/{id}/documents:
    post:
      consumes:
      - multipart/form-data
      description: User uploads a file for their own absence if not locked. Only PDF/JPG/PNG,
        max 5MB. JWT required.
      parameters:
      - description: Absence ID
        in: path
        name: id
        required: true
        type: integer
      - description: Medical certificate file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AbsenceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Upload medical certificate
      tags:
      - absence
  /api/absences/{id}/lock:
    patch:
      consumes:
      - application/json
      description: HR/admin can lock or unlock an absence to prevent user edits. JWT
        with hr/admin required.
      parameters:
      - description: Absence ID
        in: path
        name: id
        required: true
        type: integer
      - description: Lock state
        in: body
        name: lock
        required: true
        schema:
          $ref: '#/definitions/models.LockAbsenceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AbsenceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Lock or unlock an absence
      tags:
      - absence
  /api/absences/all:
    get:
      description: 'HR/admin only. Returns paginated list of all absences. Query params:
        page, page_size, user_id, date, type'
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: page_size
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - description: Filter by date (YYYY-MM-DD)
        in: query
        name: date
        type: string
      - description: Filter by type (absence/late/medical)
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AbsenceResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List all absences (HR/admin)
      tags:
      - absence
  /api/checkins:
    get:
      description: Returns all check-ins for the authenticated user, newest first.
        JWT required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CheckinResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get user's check-in history
      tags:
      - checkin
    post:
      consumes:
      - application/json
      description: User submits daily check-in with location and optional GPS. Only
        one per day. JWT required. If late, must provide reason.
      parameters:
      - description: Check-in data
        in: body
        name: checkin
        required: true
        schema:
          $ref: '#/definitions/models.CheckinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CheckinResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Submit daily check-in
      tags:
      - checkin
  /api/checkins/{id}:
    delete:
      description: HR/admin only. Soft delete a check-in by setting deleted=true.
      parameters:
      - description: Check-in ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Soft delete check-in (HR/admin)
      tags:
      - checkin
    put:
      description: Users cannot update check-ins. Use HR endpoint.
      responses:
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Not allowed
      tags:
      - checkin
  /api/checkins/all:
    get:
      description: 'HR/admin only. Returns paginated list of all check-ins. Query
        params: page, page_size, user_id, date'
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: page_size
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - description: Filter by date (YYYY-MM-DD)
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CheckinResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List all check-ins (HR/admin)
      tags:
      - checkin
  /api/checkins/batch-approve:
    post:
      consumes:
      - application/json
      description: HR/admin can approve or reject multiple check-ins in one API call.
      parameters:
      - description: Batch approve request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.BatchApproveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BatchApproveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Batch approve check-ins (HR/admin)
      tags:
      - checkin
  /api/checkins/checkout:
    post:
      consumes:
      - application/json
      description: User submits daily checkout (end-of-day). Only one per day. JWT
        required. Must have checked in first. Records checkout time, status, and overtime.
      parameters:
      - description: Checkout data
        in: body
        name: checkout
        required: true
        schema:
          $ref: '#/definitions/models.CheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CheckinResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Submit daily checkout
      tags:
      - checkin
  /api/checkins/checkout/{id}:
    put:
      consumes:
      - application/json
      description: HR or admin can update any user's checkout info (time, status,
        overtime). JWT with hr/admin role required.
      parameters:
      - description: Check-in ID
        in: path
        name: id
        required: true
        type: integer
      - description: Checkout update data
        in: body
        name: checkout
        required: true
        schema:
          $ref: '#/definitions/models.CheckoutUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CheckinResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Admin/HR update checkout
      tags:
      - checkin
  /api/checkins/today:
    get:
      description: Returns today's check-in for the authenticated user, or 404 if
        none. JWT required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CheckinResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get today's check-in
      tags:
      - checkin
  /api/dashboard/absences:
    get:
      description: Returns absence stats (total absences, by type) for date range.
        HR/admin only.
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: startDate
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get absence statistics
      tags:
      - dashboard
  /api/dashboard/analytics/heatmap:
    get:
      description: Returns a list of dates with counts of absences. HR/admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AbsenceHeatmapEntry'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get absence heatmap
      tags:
      - dashboard
  /api/dashboard/analytics/monthly:
    get:
      description: Returns monthly attendance analytics. HR/admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MonthlyStat'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get monthly analytics
      tags:
      - dashboard
  /api/dashboard/analytics/overtime:
    get:
      description: Returns a list of dates with counts of overtime. HR/admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.OvertimeStatEntry'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get overtime stats
      tags:
      - dashboard
  /api/dashboard/analytics/prediction:
    get:
      description: Returns a list of late check-in predictions for the next 7 days.
        HR/admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get late check-in prediction
      tags:
      - dashboard
  /api/dashboard/attendance:
    get:
      description: Returns attendance stats (total check-ins, on-time %, late %) for
        date range. HR/admin only.
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: startDate
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get attendance statistics
      tags:
      - dashboard
  /api/dashboard/attendance/individual:
    get:
      description: Returns checkin, absence, and user info for a given user/date.
        HR/admin only.
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      - description: Date (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get individual attendance (checkin + absence + user)
      tags:
      - dashboard
  /api/dashboard/attendance/rollcall:
